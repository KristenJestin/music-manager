[project]
name = "toolbox"
version = "0.0.0"
description = "Music Manager toolbox: stateless HTTP service around yt-dlp, mutagen, fpcalc and rsgain."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.121.0",
    "uvicorn[standard]>=0.40.0",
    "pydantic>=2.12.0",
    "structlog>=25.4.0",
    "yt-dlp>=2026.1.1",
    # Tag writing. Picard's own library: the reference for Vorbis comments, Opus pictures
    # and ID3v2.4 frames that are not plain text (TIPL, TMCL, UFID, SYLT).
    "mutagen>=1.47.0",
    # Artwork: crop to square, resize, re-encode as JPEG.
    "pillow>=11.0.0",
    # YouTube Music search (OLAK5uy_… album playlists).
    "ytmusicapi>=1.9.0",
    # The HTTP client starlette itself uses; AcoustID lookups and artwork fetches.
    "httpx2>=2.12.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
    "httpx2>=2.12.0",
    "ruff>=0.14.0",
    "pyright>=1.1.400",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toolbox"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "ANN", "PTH", "RUF"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN201", "ANN001"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.13"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# The conformance suite needs the Navidrome container, so it is opt-in: `bun run check` and
# a bare `pytest` stay host-only and offline. A command-line `-m` overrides this one.
addopts = "-q -m 'not conformance'"
markers = [
    "conformance: reads back a placed album through a real Navidrome (needs docker compose)",
    "container: needs the media binaries, so it only passes inside the toolbox image",
]
