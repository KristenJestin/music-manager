name: check

on:
  push:
    branches: ["main", "dev", "phase/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-messages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Angular subjects only
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          head="${{ github.event.pull_request.head.sha || github.sha }}"
          bad=0
          while IFS= read -r line; do
            subject="${line#* }"
            case "$subject" in "Merge "*) continue;; esac
            if ! printf '%s' "$subject" | grep -qE '^(feat|fix|refactor|test|docs|chore|build|ci|perf)(\([a-z0-9-]+\))?!?: [^ ].{0,71}$'; then
              echo "::error::$line — expected <type>(<scope>): <subject>, type among feat fix refactor test docs chore build ci perf, subject at most 72 characters"
              bad=1
            fi
          done < <(git log --format='%h %s' "$base..$head")
          exit $bad

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.10"
          enable-cache: true
          cache-dependency-glob: services/toolbox/uv.lock

      - name: Install TypeScript dependencies
        run: bun install --frozen-lockfile

      - name: Install Python dependencies
        run: uv sync --frozen
        working-directory: services/toolbox

      # tsc, eslint, prettier, vitest, ruff, pyright, pytest.
      - name: Check
        run: bun run check

      # The generated toolbox contract must be reproducible.
      - name: Toolbox contract is up to date
        run: |
          bun run toolbox:openapi
          git diff --exit-code -- packages/contracts/toolbox
