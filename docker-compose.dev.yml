# Development stack. Only the web app runs on the host (`bun run dev`); everything it
# talks to runs here.
#
#   docker compose -f docker-compose.dev.yml up -d --build
#
# `./.local/` holds all mutable state (postgres is on a named volume, Navidrome's database
# and the music library are bind mounts). It is gitignored and safe to delete.
#
# ---------------------------------------------------------------------------
# One project per checkout — do not run this file without `-p`.
# ---------------------------------------------------------------------------
# `name: mm-dev` below is the *default* project name, and it is right for `v2/` only. Compose
# addresses containers as `<project>-<service>-N`, and the bind mounts here are relative to
# whichever copy of this file was used. So a `docker compose up` run from a `git worktree` finds
# the shared `mm-dev-toolbox-1` by name and **recreates** it mounting the worktree's
# `./.local/library` — silently moving the library out from under whoever was using it. That
# happened during P07-verify-1 (`orchestration/reports/P07-verify-1.md` §9).
#
# The parade is `bun run stack:up` (`scripts/stack.ts`), which always passes `-p` and sets the
# port variables below from the checkout: `mm-dev` with 5432/4533/8100 in `v2/`, and `mm-<slug>`
# with ports of its own in a worktree. Both `-p` and `COMPOSE_PROJECT_NAME` override `name:`;
# the defaults keep a bare `docker compose -f docker-compose.dev.yml …` in `v2/` identical to
# what it was before the variables existed.

name: mm-dev

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: mm
      POSTGRES_PASSWORD: mm
      POSTGRES_DB: mm
    ports:
      - "${MM_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mm -d mm"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Conformance target: what we write to disk must be readable by a real OpenSubsonic
  # server. Used by the P02 conformance test and by `verify` in P07.
  navidrome:
    # Upstream publishes to docker.io/deluan/navidrome; there is no navidrome/navidrome repo.
    image: deluan/navidrome:latest
    restart: unless-stopped
    environment:
      ND_DEVAUTOCREATEADMINPASSWORD: admin
      ND_SCANSCHEDULE: "@every 1m"
      ND_LOGLEVEL: info
    ports:
      - "${MM_NAVIDROME_PORT:-4533}:4533"
    volumes:
      - ./.local/navidrome:/data
      - ./.local/library:/music:ro

  toolbox:
    build:
      context: .
      dockerfile: docker/toolbox.Dockerfile
    restart: unless-stopped
    environment:
      # Empty means "no authentication", which is the default in development.
      MM_TOOLBOX_TOKEN: ${MM_TOOLBOX_TOKEN:-}
      MM_TOOLBOX_FIXTURES: ${MM_TOOLBOX_FIXTURES:-0}
      # Refresh yt-dlp at start-up. Off by default so `compose up` stays offline-friendly.
      MM_YTDLP_AUTOUPDATE: ${MM_YTDLP_AUTOUPDATE:-0}
      # Pace of the fixture download, in milliseconds per slice. Raise it for a demo.
      MM_TOOLBOX_FIXTURE_DELAY_MS: ${MM_TOOLBOX_FIXTURE_DELAY_MS:-20}
      # AcoustID key for /fingerprint. Without it the fingerprint is still computed.
      MM_ACOUSTID_KEY: ${MM_ACOUSTID_KEY:-}
    ports:
      - "${MM_TOOLBOX_PORT:-8100}:8100"
    volumes:
      - ./.local/library:/library

volumes:
  postgres-data:
