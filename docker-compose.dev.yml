# Development stack. Only the web app runs on the host (`bun run dev`); everything it
# talks to runs here.
#
#   docker compose -f docker-compose.dev.yml up -d --build
#
# `./.local/` holds all mutable state (postgres is on a named volume, Navidrome's database
# and the music library are bind mounts). It is gitignored and safe to delete.
#
# ---------------------------------------------------------------------------
# One project per checkout — do not run this file without `-p`.
# ---------------------------------------------------------------------------
# `name: mm-dev` below is the *default* project name, and it is right for `v2/` only. Compose
# addresses containers as `<project>-<service>-N`, and the bind mounts here are relative to
# whichever copy of this file was used. So a `docker compose up` run from a `git worktree` finds
# the shared `mm-dev-toolbox-1` by name and **recreates** it mounting the worktree's
# `./.local/library` — silently moving the library out from under whoever was using it. That
# happened during P07-verify-1 (`orchestration/reports/P07-verify-1.md` §9).
#
# The parade is `bun run stack:up` (`scripts/stack.ts`), which always passes `-p` and sets the
# port variables below from the checkout: `mm-dev` with 5432/4533/8100 in `v2/`, and `mm-<slug>`
# with ports of its own in a worktree. Both `-p` and `COMPOSE_PROJECT_NAME` override `name:`;
# the defaults keep a bare `docker compose -f docker-compose.dev.yml …` in `v2/` identical to
# what it was before the variables existed.

name: mm-dev

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: mm
      POSTGRES_PASSWORD: mm
      POSTGRES_DB: mm
    ports:
      - "${MM_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mm -d mm"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Conformance target: what we write to disk must be readable by a real OpenSubsonic
  # server. Used by the P02 conformance test and by `verify` in P07.
  navidrome:
    # Upstream publishes to docker.io/deluan/navidrome; there is no navidrome/navidrome repo.
    image: deluan/navidrome:latest
    restart: unless-stopped
    environment:
      ND_DEVAUTOCREATEADMINPASSWORD: admin
      ND_SCANSCHEDULE: "@every 1m"
      ND_LOGLEVEL: info
      # Off, and the reason is a bug report: Navidrome imports every M3U it finds under the
      # music folder as a playlist of its own, and `mm migrate v1` used to write the v1 exports
      # to `<library>/_archive/v1-playlists` — inside it. The export is dot-prefixed now, but
      # this installation owns its playlists through the Subsonic API (Discover pushes one),
      # never through files, so auto-import has nothing to contribute and one way to surprise.
      ND_AUTOIMPORTPLAYLISTS: "false"
    ports:
      - "${MM_NAVIDROME_PORT:-4533}:4533"
    volumes:
      - ./.local/navidrome:/data
      - ./.local/library:/music:ro

  toolbox:
    build:
      context: .
      dockerfile: docker/toolbox.Dockerfile
    restart: unless-stopped
    environment:
      # Empty means "no authentication", which is the default in development.
      MM_TOOLBOX_TOKEN: ${MM_TOOLBOX_TOKEN:-}
      MM_TOOLBOX_FIXTURES: ${MM_TOOLBOX_FIXTURES:-0}
      # Refresh yt-dlp at start-up. Off by default so `compose up` stays offline-friendly.
      MM_YTDLP_AUTOUPDATE: ${MM_YTDLP_AUTOUPDATE:-0}
      # Pace of the fixture download, in milliseconds per slice. Raise it for a demo.
      MM_TOOLBOX_FIXTURE_DELAY_MS: ${MM_TOOLBOX_FIXTURE_DELAY_MS:-20}
      # AcoustID key for /fingerprint. Without it the fingerprint is still computed.
      MM_ACOUSTID_KEY: ${MM_ACOUSTID_KEY:-}
      # The same two switches as in production: the level floor of the JSON logs, and
      # yt-dlp's own debug stream when one extraction has to be read line by line.
      MM_LOG_LEVEL: ${MM_LOG_LEVEL:-info}
      MM_YTDLP_VERBOSE: ${MM_YTDLP_VERBOSE:-0}
    ports:
      - "${MM_TOOLBOX_PORT:-8100}:8100"
    volumes:
      - ./.local/library:/library
      # `cookiesMode: file` in Settings → Downloader points here (`/data/cookies.txt`), and
      # only here: a bind mount survives `up --force-recreate`, which the toolbox's own
      # writable layer does not. Drop the export at `./.local/cookies/cookies.txt` on the
      # host. `cookiesMode: paste` needs none of this — that jar lives in the `settings`
      # table, on the `postgres-data` volume below, already durable.
      - ./.local/cookies:/data:ro
      # An existing music library, for `mm import <folder>`.
      #
      # The toolbox runs ffprobe on every file of a folder import, so it has to *see* the
      # folder. Inside `./.local/library` that is free — the mount above already covers it, and
      # that is exactly where the fixtures build their source folder. A folder anywhere else is
      # invisible to this container until it is mounted, and this is the mount:
      #
      #     MM_ADOPT_PATH=D:/Musique bun run stack:up
      #
      # In development the app runs on the *host*, so it reads the folder by its host path
      # while the toolbox reads it by the container path — the same two-ended arrangement as
      # `MM_LIBRARY_ROOT` / `MM_TOOLBOX_LIBRARY_ROOT`, and the reason the two are made equal in
      # production (`docker-compose.prod.yml`, `x-adopt`). On Windows they cannot be, so a
      # development folder import outside the library is a fixtures-only exercise.
      #
      # **Read-only, always.** Music Manager reads these bytes and copies them; it never writes
      # to, moves or deletes the original, and `:ro` is what makes that a fact about the
      # deployment rather than a promise in a comment. `adoptSourceRoots` must list the path
      # too, or every file under it is refused with `ADOPT_PATH_REFUSED`.
      #
      # The default points back at the library, so the mount always exists and never surprises
      # anyone who has not set the variable.
      - ${MM_ADOPT_PATH:-./.local/library}:/adopt:ro

volumes:
  postgres-data:
